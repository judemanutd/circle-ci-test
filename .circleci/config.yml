version: 2.1

orbs:
  node: circleci/node@5.1.0

jobs:
  test:
    docker:
      - image: cimg/node:18.16-browsers
    resource_class: large
    steps:
      - checkout
      
      # Install dependencies
      - run:
          name: Install pnpm
          command: npm install -g pnpm@8.15.0
      
      - run:
          name: Install dependencies
          command: pnpm install
      
      # Install Playwright browsers
      - run:
          name: Install Playwright Browsers
          command: npx playwright install --with-deps
      
      # Run Playwright tests with Circle CI test splitting
      - run:
          name: Run Playwright Tests
          command: |
            mkdir -p test-results
            TESTFILES=$(circleci tests glob "tests/**/*.spec.js")
            echo "$TESTFILES" | circleci tests run --command="xargs pnpm playwright test --reporter=junit" --verbose --split-by=timings
          # Continue even if tests fail so we can collect artifacts
          when: always
      
      # Store test results (XML format for CircleCI test summary)
      - store_test_results:
          path: test-results/results.xml
      
      # Store HTML report and other artifacts
      - store_artifacts:
          path: playwright-report
          destination: playwright-report
      
      # Store test results as artifacts as well
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  test-workflow:
    jobs:
      - test