version: 2.1

executors:
  node-postgres:
    docker:
      - image: cimg/node:22.18.0
        environment:
          NODE_ENV: test
    working_directory: ~/workspace
    resource_class: large

commands:
  # STEP 1: Install system dependencies
  install-system-deps:
    steps:
      - run:
          name: Install other system dependencies
          command: |
            sudo apt-get update
            sudo apt-get install -y curl jq
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
            npx playwright install --with-deps chromium

  # STEP 7: Start Playwright tests
  start-tests:
    steps:
      - run:
          name: Run Playwright Tests
          command: |
            mkdir -p test-results
            TESTFILES=$(circleci tests glob "tests/**/*.spec.js")
            echo "$TESTFILES" | circleci tests run --command="xargs npx playwright test --reporter=junit" --verbose --split-by=timings
          # Continue even if tests fail so we can collect artifacts
          when: always

jobs:
  setup-and-test:
    executor: node-postgres
    steps:
      - checkout
      - install-system-deps
      - start-tests

      # Store test results (XML format for CircleCI test summary)
      - store_test_results:
          path: test-results/results.xml

      # Store HTML report and other artifacts
      - store_artifacts:
          path: playwright-report
          destination: playwright-report

      # Store test results as artifacts as well
      - store_artifacts:
          path: test-results
          destination: test-results

workflows:
  build-and-test:
    jobs:
      - setup-and-test
