version: 2.1

executors:
  node-playwright:
    docker:
      - image: cimg/node:22.18-browsers
        environment:
          NODE_ENV: test
    working_directory: ~/workspace
    resource_class: large

commands:
  # Install deps and Playwright browsers using the local CLI
  install-system-deps:
    steps:
      - run:
          name: Install dependencies & Playwright browsers
          command: |
            sudo npm install -g pnpm
            pnpm install --frozen-lockfile
            pnpm exec playwright install --with-deps chromium

  # Run tests in a way that supports CircleCI's "Rerun failed tests" feature
  start-tests:
    steps:
      - run:
          name: Run Playwright Tests (split + rerun-compatible)
          command: |
            mkdir -p test-results
            circleci tests glob "tests/**/*.{spec,test}.{js,jsx,ts,tsx}" \
            | circleci tests split --split-by=timings \
            | circleci tests run \
                --verbose \
                --command="xargs -n 25 pnpm exec playwright test -c playwright.config.js"
          when: always

jobs:
  setup-and-test:
    executor: node-playwright
    steps:
      - checkout
      - install-system-deps
      - start-tests

      # CircleCI expects a DIRECTORY here; it will find junit.xml inside.
      - store_test_results:
          path: test-results

      - store_artifacts:
          path: test-results
          destination: test-results

      - store_artifacts:
          path: playwright-report
          destination: playwright-report

workflows:
  build-and-test:
    jobs:
      - setup-and-test
